site_title: Ercyon
site_subtitle: Хроника вольных земель
motto: Займи своё место в истории
description: Ролевой проект в Telegram. Мир Эрциона — королевства, договоры, войны и живая магия. Пиши свою страну в общую хронику.

# Ссылка на группу/канал в Telegram (кнопка «В группу»)
telegram_url: https://t.me/Ercyon
telegram_label: В группу

# Адрес сайта (нужен для карты сайта и превью ссылок в чатах)
site_url: https://ercyon.netlify.app

# ── Статус сезона ───────────────────────────────────────────────────
season:
  number: 3
  title: Сезон III — «Тернии и Живица»
  year: 417 год Второй Эпохи
  mode: Открытый набор
  state: idet            # idet | nabor | pauza | zavershen
  state_label: Идёт
  note: Заявки на новые страны принимаются. Ход мира — один игровой месяц в неделю.

# ── Разделы бокового меню ──────────────────────────────────────────
# id — служебное имя латиницей, оно же начало адреса страниц.
# icon — значок из пака: наглядная шпаргалка на /admin/icons.html
# Порядок разделов = порядок в этом списке, его можно перетаскивать.
categories:
  - id: base
    title: Базовое
    icon: seal
    intro: С чего начать, как всё устроено и по каким правилам живёт мир.
  - id: lore
    title: Лор
    icon: leaf
    intro: История Эрциона, магия, народы и те, кто вершит судьбы.
  - id: maps
    title: Карты
    icon: map
    intro: "Как выглядит мир: границы, земли и то, что под ними."
  - id: countries
    title: Страны
    icon: banner
    intro: Досье держав, порядок вступления и реестр договоров.
  - id: mechanics
    title: Механики
    icon: scales
    intro: Правила экспансии, торговли, войн и исследований.
  - id: news
    title: Новости и пресса
    icon: quill
    intro: Что происходит в мире прямо сейчас и что пишут игроки.
  - id: season
    title: Сезон
    icon: crown
    intro: Итоги, номинации и те, чьи имена остались в хронике.

# ── Подпись внизу сайта ─────────────────────────────────────────────
footer_note: Эрцион — некоммерческий ролевой проект. Все земли, дома и имена вымышлены.
