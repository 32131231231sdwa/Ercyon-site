# ═══════════════════════════════════════════════════════════════════
#  Настройки публикации на Netlify.
#  Netlify читает этот файл сам — ничего дополнительно указывать не надо.
# ═══════════════════════════════════════════════════════════════════

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Картинки, шрифты и стили кэшируются надолго — сайт открывается мгновенно.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Страницы всегда свежие: после правки в панели читатель сразу видит новый текст.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
