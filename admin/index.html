<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14352A">
  <title>Панель редактора — Ercyon</title>
  <link href="config.yml" type="text/yaml" rel="cms-config-url">
  <link rel="icon" href="/img/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <style>
    html,body{margin:0;background:#0D2119;min-height:100%}
    #boot{
      position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:1rem;
      color:#E9E2CD;font:400 1rem/1.5 Georgia,serif;text-align:center;padding:2rem;
      padding-top:calc(2rem + env(safe-area-inset-top))
    }
    #boot img{width:88px;height:88px;border-radius:50%;opacity:.92}
    #boot b{font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;color:#B08D4A}
    #boot small{color:#A9BCA9;max-width:22rem;display:block}
    #boot a{color:#D5B87C}
  </style>
</head>
<body>
  <div id="boot">
    <img src="/img/logo-128.webp" alt="">
    <b>Ercyon</b>
    <span>Загружаем панель редактора…</span>
    <small>Если экран не меняется больше минуты — обновите страницу.
      Панель работает и на телефоне: её можно добавить на домашний экран
      как обычное приложение.</small>
  </div>

  <!-- Панель редактора Sveltia CMS.
       Версия закреплена намеренно: панель не изменится сама по себе.
       Настройки полей и разделов — в файле рядом, config.yml. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.182.0/dist/sveltia-cms.js"></script>

  <script>
    // Заставка исчезает, когда панель поднялась
    (function () {
      var boot = document.getElementById('boot');
      var hide = function () { if (boot) boot.style.display = 'none'; };
      window.addEventListener('load', function () { setTimeout(hide, 1500); });
      // на всякий случай — если панель отрисовалась раньше
      new MutationObserver(function (m, obs) {
        if (document.querySelector('#nc-root, [class*="sveltia"], #app')) { hide(); obs.disconnect(); }
      }).observe(document.body, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
