# Панель редактирования правил и механик. Общая конфигурация /admin/ и /admin-classic/.
backend:
  name: github
  repo: 32131231231sdwa/Ercyon-site
  branch: main
  commit_messages:
    create: 'Добавлено: {{collection}} «{{slug}}»'
    update: 'Правка: {{collection}} «{{slug}}»'
    delete: 'Удалено: {{collection}} «{{slug}}»'
    uploadMedia: 'Загружен файл: {{path}}'
    deleteMedia: 'Удалён файл: {{path}}'
locale: ru
media_folder: static/img/uploads
public_folder: /img/uploads
media_library:
  max_file_size: 6000000
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: settings
    label: Настройки
    label_singular: настройку
    description: Оформление справочника, главная страница и подписи интерфейса.
    files:
      - name: site
        label: Основные настройки сайта
        file: content/settings.yml
        description: Название, описание, ссылка на Telegram и два раздела справочника.
        fields:
          - name: site_title
            label: Название проекта
            widget: string
            hint: Крупная надпись в шапке и на главной
          - name: site_subtitle
            label: Подзаголовок
            widget: string
            required: false
          - name: motto
            label: Девиз
            widget: string
          - name: description
            label: Описание проекта
            widget: text
            hint: Одно-два предложения. Видно в поиске Google и при отправке ссылки в чат.
          - name: telegram_url
            label: Ссылка на Telegram
            widget: string
          - name: telegram_label
            label: Надпись на кнопке
            widget: string
            default: В группу
          - name: site_url
            label: Адрес сайта
            widget: string
            hint: Например https://ercyon.netlify.app — без косой черты в конце
          - name: categories
            label: Разделы меню
            label_singular: раздел
            widget: list
            summary: '{{fields.title}}'
            hint: 'В справочнике два раздела: правила и механики. Их порядок можно менять.'
            fields:
              - name: id
                label: Раздел
                widget: select
                options:
                  - label: Правила
                    value: rules
                  - label: Механики
                    value: mechanics
              - name: title
                label: Название
                widget: string
              - name: icon
                label: Значок
                widget: select
                default: leaf
                hint: Как выглядит каждый значок — откройте /admin/icons.html
                options:
                  - label: 🌿 Лист
                    value: leaf
                  - label: 🌳 Дуб
                    value: oak
                  - label: 🌱 Папоротник
                    value: fern
                  - label: 🥀 Терн
                    value: thorn
                  - label: 👑 Корона
                    value: crown
                  - label: ⚔️ Меч
                    value: sword
                  - label: 🛡️ Щит
                    value: shield
                  - label: 🚩 Знамя
                    value: banner
                  - label: 🏰 Замок
                    value: castle
                  - label: 🗼 Башня
                    value: tower
                  - label: ⛩️ Врата
                    value: gate
                  - label: 🌉 Мост
                    value: bridge
                  - label: 📜 Свиток
                    value: scroll
                  - label: 📖 Книга
                    value: book
                  - label: 🖋️ Перо
                    value: quill
                  - label: 🔴 Печать
                    value: seal
                  - label: 🗝️ Ключ
                    value: key
                  - label: 🪙 Монета
                    value: coin
                  - label: ⚖️ Весы
                    value: scales
                  - label: ⚒️ Наковальня
                    value: anvil
                  - label: 🔨 Молот
                    value: hammer
                  - label: ⚙️ Шестерня
                    value: gear
                  - label: 🧭 Компас
                    value: compass
                  - label: 🗺️ Карта
                    value: map
                  - label: ⛵ Корабль
                    value: ship
                  - label: ⛰️ Гора
                    value: mountain
                  - label: 🌙 Луна
                    value: moon
                  - label: ☀️ Солнце
                    value: sun
                  - label: ⭐ Звезда
                    value: star
                  - label: 🔥 Пламя
                    value: flame
                  - label: 💧 Капля
                    value: drop
                  - label: 🐺 Волк
                    value: wolf
                  - label: 🐦 Ворон
                    value: raven
              - name: intro
                label: Описание раздела
                widget: text
                required: false
                hint: Строчка под названием на карточке и в обзоре раздела
            min: 2
            max: 2
          - name: footer_note
            label: Подпись внизу сайта
            widget: text
            required: false
      - name: labels
        label: Подписи интерфейса
        file: content/labels.yml
        description: Подписи меню, поиска, страницы ошибки и врезок.
        fields:
          - name: labels
            label: Подписи
            widget: object
            fields:
              - name: nav
                label: Меню, шапка, подвал
                widget: object
                collapsed: true
                fields:
                  - name: overview
                    label: Обзор раздела
                    widget: string
                  - name: home
                    label: Главная
                    widget: string
                  - name: search_button
                    label: Кнопка поиска
                    widget: string
                  - name: search_placeholder
                    label: Подсказка в поле поиска
                    widget: string
                  - name: search_hint
                    label: Пояснение под поиском
                    widget: text
                  - name: search_nothing
                    label: Ничего не найдено
                    widget: text
                    hint: Вместо {q} подставится то, что искали
                  - name: toc_head
                    label: Заголовок оглавления
                    widget: string
                  - name: updated
                    label: Подпись «Обновлено»
                    widget: string
                  - name: foot_home
                    label: 'Подвал: главная'
                    widget: string
                  - name: foot_search
                    label: 'Подвал: поиск'
                    widget: string
                  - name: foot_admin
                    label: 'Подвал: панель'
                    widget: string
              - name: search
                label: Страница поиска
                widget: object
                collapsed: true
                fields:
                  - name: page_title
                    label: Заголовок
                    widget: string
                  - name: page_note
                    label: Пояснение
                    widget: text
                  - name: page_placeholder
                    label: Подсказка в поле
                    widget: string
              - name: notfound
                label: Страница не найдена
                widget: object
                collapsed: true
                fields:
                  - name: title
                    label: Заголовок
                    widget: string
                  - name: note
                    label: Пояснение
                    widget: text
                  - name: home
                    label: Кнопка на главную
                    widget: string
                  - name: search
                    label: Кнопка поиска
                    widget: string
              - name: callouts
                label: Заголовки врезок
                widget: object
                collapsed: true
                fields:
                  - name: seal
                    label: Врезка seal (с печатью)
                    widget: string
                  - name: note
                    label: Врезка note (заметка)
                    widget: string
                  - name: warn
                    label: Врезка warn (внимание)
                    widget: string
                  - name: quote
                    label: Врезка quote (цитата)
                    widget: string
      - name: home
        label: Главная страница
        file: content/home.md
        description: Вступление и название разделов на главной странице справочника.
        fields:
          - name: title
            label: Служебный заголовок
            widget: hidden
            default: Главная
          - name: intro_title
            label: Заголовок над карточками
            widget: string
            required: false
          - name: intro_text
            label: Вступление под девизом
            widget: text
            hint: Два-три предложения. Это первое, что читает новый игрок.
          - name: body
            label: Пояснение под разделами
            widget: markdown
            required: false
  - name: pages
    label: Правила и механики
    label_singular: страницу
    description: Технические материалы ролевого проекта.
    folder: content/pages
    create: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{title}}  ·  {{category}}'
    sortable_fields:
      - title
      - order
    fields:
      - name: title
        label: Заголовок
        widget: string
      - name: category
        label: Раздел меню
        widget: select
        options:
          - label: Правила
            value: rules
          - label: Механики
            value: mechanics
      - name: order
        label: Порядок в меню
        widget: number
        value_type: int
        default: 100
        hint: Чем меньше число, тем выше страница в списке
      - name: section_home
        label: Эта страница — весь раздел
        widget: boolean
        default: false
        required: false
        hint: >-
          Включайте, когда в разделе одна страница (как «Правила»): раздел в меню станет ссылкой прямо на неё,
          а адрес будет коротким — /rules/
      - name: slug
        label: Адрес страницы
        widget: string
        pattern:
          - ^[a-z0-9-]+$
          - Только латиница, цифры и дефис
        hint: Латиницей. Например research → /mechanics/research/.
      - name: summary
        label: Короткое описание
        widget: text
        required: false
        hint: Одно предложение — видно в карточках раздела и в поиске
      - name: body
        label: Текст страницы
        widget: markdown
